name: Commitkin dry-run preview

"on":
  workflow_dispatch:
    inputs:
      faction:
        description: Temporary preview faction only; nothing is saved
        type: choice
        required: true
        options:
          - bloomguard
          - ashbound
        default: bloomguard

# Deliberately read-only. No schedule, push trigger, PAT or publication input.
permissions:
  contents: read

concurrency:
  group: commitkin-profile-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the basic-token quota before collecting
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const result = await fetch('https://api.github.com/rate_limit', {
            method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10000),
            headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
          });
          if (!result.ok) throw new Error('QUOTA_CHECK_UNAVAILABLE');
          const { core } = (await result.json()).resources ?? {};
          if (!core || !['limit', 'remaining', 'reset'].every(key => Number.isSafeInteger(core[key]) && core[key] >= 0)) throw new Error('QUOTA_CHECK_INVALID');
          console.log(JSON.stringify({ code: 'BASIC_TOKEN_QUOTA', limit: core.limit, remaining: core.remaining, resetAt: new Date(core.reset * 1000).toISOString() }));
          if (core.remaining < 900) {
            console.log('Analysis not attempted: wait until the reported quota reset before another manual dry-run.');
            process.exitCode = 2;
          }
          NODE
      - name: Prepare a character in memory without publishing
        uses: JEONTAK/commitkin@ac96eb63f70904ea790bfcaf9d3a5dae38d81f46
        with:
          token: ${{ github.token }}
          faction: ${{ inputs.faction }}
          # This initialization confirmation exists only in memory in dry-run.
          # It does not persist a faction or authorize a real growth update.
          confirmation: CONFIRM_PERMANENT_FACTION
          dry-run: 'true'
