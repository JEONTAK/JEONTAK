name: Commitkin profile display preview

"on":
  workflow_dispatch:
    inputs:
      source_repository:
        description: Your verified Commitkin installation; author default below
        type: string
        required: true
        default: JEONTAK/commitkin-character

permissions:
  contents: read

concurrency:
  group: commitkin-profile-display
  cancel-in-progress: false

jobs:
  preview:
    # One explicitly approved presentation-only publication; restore read-only after.
    if: ${{ github.repository_id == '773666201' && github.repository_owner_id == '76037656' && github.actor_id == '76037656' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the approved compact profile block only
        uses: JEONTAK/commitkin/profile-sync@603760d17a48db6bdec36db62e433f1e08f6a9ce
        with:
          token: ${{ github.token }}
          source-repository: ${{ inputs.source_repository }}
          dry-run: 'false'

# One-off image/layout publication approved explicitly. No schedule, push hook,
# growth calculation or automatic source-triggered run is enabled.
